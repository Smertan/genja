[package]
name = "genja"
version = "0.1.0"
edition = "2024"
description = "A plugin-based Rust framework for executing tasks across multiple hosts with inventory filtering, hierarchical task execution, dynamic plugin loading, and result tracking"
license = "AGPL-3.0-only"
repository = "https://github.com/Smertan/genja"
readme = "README.md"
keywords = ["automation", "tasks", "inventory"]
categories = ["development-tools"]

[dependencies]
async-trait = "0.1.89"
genja-core = { version = "0.1.0", path = "../genja-core" }
genja-core-derive = { version = "0.1.0", path = "../genja-core-derive" }
genja-plugin-manager = { version = "0.1.0", path = "../genja-plugin-manager" }
log = "0.4.27"
regex = "1.12.2"
serde_json = "1.0.142"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync"] }
