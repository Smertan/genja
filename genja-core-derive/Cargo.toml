[package]
name = "genja-core-derive"
version = "0.1.0"
edition = "2024"
authors = ["Andre Bowen-Brown <contact@genja.co.uk>"]
readme = "README.md"
description = "Procedural macros for Genja task types, including derives for task metadata, subtasks, and wrapper dereferencing"
license = "MPL-2.0"
repository = "https://github.com/Smertan/genja"
homepage = "https://docs.genja.co.uk"
keywords = ["macro", "derive", "tasks", "automation"]
categories = ["development-tools", "rust-patterns"]

[dependencies]
proc-macro2 = "1.0.101"
quote = "1.0.40"
syn = { version = "2.0.106", features = ["full"] }

[dev-dependencies]
trybuild = "1.0.113"

[lib]
proc-macro = true
