[project]
site_name = "Genja"
site_url = "https://docs.genja.co.uk/"
copyright = "Copyright &copy; 2026 Genja by Smertan Networks Ltd"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/Smertan/genja"
nav = [
  {"Home" = "index.md"},
  {"Installation" = "installation.md"},
  {"Quickstart" = "quickstart.md"},
  {"Concepts" = "concepts.md"},
  {"Settings" = "settings.md"},
  {"API Surface" = "api-surface.md"},
  {"Inventory" = "inventory.md"},
  {"Tasks" = [
    "tasks.md",
    {"Task Registration" = "task-registration.md"},
  ]},
  {"Runners" = "runners.md"},
  {"Plugins" = [
    "plugins/index.md",
    {"Connections" = "connection.md"},
    {"Processors" = "processors.md"},
    {"Transforms" = "transforms.md"},
  ]},
  {"Examples" = "examples.md"},
  {"Versions And Compatibility" = "version-compatibility.md"},
  {"Logging And Troubleshooting" = "logging-troubleshooting.md"},
  {"Development" = [
    {"Contributing" = "contributing.md"},
    {"License" = "license.md"},
  ]},
]

[project.theme]
features = ["content.tabs.link", "navigation.footer", "navigation.indexes"]
logo = "assets/images/genja_logo.png"
favicon = "assets/images/genja_logo.png"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Smertan/genja"


[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions.attr_list]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.superfences]
