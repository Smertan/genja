[package]
name = "genja-cli"
version = "0.4.0"
edition = "2024"
authors = ["Andre Bowen-Brown <contact@genja.co.uk>"]
description = "First-party command-line interface for Genja automation workflows"
license = "MPL-2.0"
repository = "https://github.com/Smertan/genja"
homepage = "https://docs.genja.co.uk"
readme = "README.md"
keywords = ["automation", "tasks", "cli", "orchestration"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "genja_cli"
path = "src/lib.rs"

[[bin]]
name = "genja"
path = "src/main.rs"

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.2"
crossterm = { version = "0.29", optional = true, default-features = false, features = ["events", "windows"] }
genja-core = { version = "0.4.0", path = "../genja-core" }
ratatui = { version = "0.30.2", optional = true, default-features = false, features = ["crossterm"] }
serde_json = "1.0.142"
yaml_serde = "0.10"
