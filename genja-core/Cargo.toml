[package]
name = "genja-core"
version = "0.1.0"
edition = "2024"
authors = ["Andre Bowen-Brown <contact@genja.co.uk>"]
description = "Core Genja primitives for task execution, inventory modeling, settings loading, connection state, and structured task results"
license = "MPL-2.0"
repository = "https://github.com/Smertan/genja"
homepage = "https://docs.genja.co.uk"
readme = "README.md"
keywords = ["automation", "inventory", "tasks", "orchestration", "plugin"]
categories = ["development-tools", "asynchronous", "network-programming"]

[dependencies]
async-recursion = "1.1.1"
async-trait = "0.1.89"
log = "0.4.27"
natord = "1.0.9"
genja-core-derive = { version = "0.1.0", path = "../genja-core-derive" }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.142"
serde_yaml = "0.9.34"
dashmap = "5.5.3"
config = "0.15.19"
ssh2-config = "0.6.5"
tracing = "0.1.44"
humantime = "2.2.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
regex = "1.12.2"
tempfile = "3.24.0"
tracing-rolling-file = { version = "0.1.3", features = ["non-blocking"] }
tracing-subscriber = "0.3"
trybuild = "1.0.113"
