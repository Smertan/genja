name: Publish Python Package

on:
  push:
    tags:
      - "py-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Python release tag to publish, formatted as py-vX.Y.Z"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate PyPI release
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Validate release
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if ! printf '%s' "${RELEASE_TAG}" | grep -Eq '^py-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag must match py-vX.Y.Z: ${RELEASE_TAG}" >&2
            exit 1
          fi

          git fetch origin main --tags
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "${RELEASE_TAG} must point to a commit reachable from origin/main" >&2
            exit 1
          fi

          version="${RELEASE_TAG#py-v}"
          python - "${version}" <<'PY'
          import sys
          import tomllib

          expected = sys.argv[1]
          with open("genja-core-python/pyproject.toml", "rb") as pyproject:
              actual = tomllib.load(pyproject)["project"]["version"]

          if actual != expected:
              raise SystemExit(
                  f"pyproject.toml version {actual} does not match release tag version {expected}"
              )
          PY

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build-wheels:
    name: Build wheel (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            maturin-args: --release --out dist -i python3.10 --compatibility pypi
          - os: ubuntu-latest
            python-version: "3.11"
            maturin-args: --release --out dist -i python3.11 --compatibility pypi
          - os: ubuntu-latest
            python-version: "3.12"
            maturin-args: --release --out dist -i python3.12 --compatibility pypi
          - os: ubuntu-latest
            python-version: "3.13"
            maturin-args: --release --out dist -i python3.13 --compatibility pypi
          - os: ubuntu-latest
            python-version: "3.14"
            maturin-args: --release --out dist -i python3.14 --compatibility pypi
          - os: macos-latest
            python-version: "3.10"
            maturin-args: --release --out dist --interpreter python --compatibility pypi
          - os: macos-latest
            python-version: "3.11"
            maturin-args: --release --out dist --interpreter python --compatibility pypi
          - os: macos-latest
            python-version: "3.12"
            maturin-args: --release --out dist --interpreter python --compatibility pypi
          - os: macos-latest
            python-version: "3.13"
            maturin-args: --release --out dist --interpreter python --compatibility pypi
          - os: macos-latest
            python-version: "3.14"
            maturin-args: --release --out dist --interpreter python --compatibility pypi
          - os: windows-latest
            python-version: "3.10"
            maturin-args: --release --out dist --interpreter python --compatibility pypi
          - os: windows-latest
            python-version: "3.11"
            maturin-args: --release --out dist --interpreter python --compatibility pypi
          - os: windows-latest
            python-version: "3.12"
            maturin-args: --release --out dist --interpreter python --compatibility pypi
          - os: windows-latest
            python-version: "3.13"
            maturin-args: --release --out dist --interpreter python --compatibility pypi
          - os: windows-latest
            python-version: "3.14"
            maturin-args: --release --out dist --interpreter python --compatibility pypi

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          OPENSSL_NO_VENDOR: 1
        with:
          command: build
          args: ${{ matrix.maturin-args }}
          working-directory: genja-core-python
          manylinux: auto
          before-script-linux: |
            yum install -y openssl-devel pkgconfig

      - name: Test installed wheel
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import os
          import shutil
          import subprocess
          import sys
          import tempfile

          wheels = glob.glob(os.path.join("genja-core-python", "dist", "*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel, found {len(wheels)}: {wheels}")

          subprocess.run([sys.executable, "-m", "pip", "install", "--upgrade", "pip"], check=True)
          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  wheels[0],
                  "pytest>=9.0.3",
                  "pytest-asyncio>=1.4.0",
              ],
              check=True,
          )

          source_tests = os.path.join(
              os.environ["GITHUB_WORKSPACE"],
              "genja-core-python",
              "python",
              "tests",
          )
          test_root = tempfile.mkdtemp(prefix="genja-wheel-tests-")
          tests = os.path.join(test_root, "tests")
          shutil.copytree(source_tests, tests)
          os.chdir(test_root)
          subprocess.run([sys.executable, "-m", "pytest", "-v", tests], check=True)
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}-${{ matrix.python-version }}
          path: genja-core-python/dist/*

  build-sdist:
    name: Build source distribution
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Install maturin
        run: python -m pip install "maturin>=1,<2"

      - name: Build source distribution
        working-directory: genja-core-python
        run: maturin sdist --out dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: genja-core-python/dist/*

  publish:
    name: Publish to PyPI
    needs:
      - validate
      - build-wheels
      - build-sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
