name: Cross-Platform Compatibility

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure PDM environment
        working-directory: genja-core-python
        run: |
          pdm config venv.with_pip true
          python -c "import subprocess, sys; subprocess.check_call(['pdm', 'use', '-f', sys.executable])"

      - name: Install Python dependencies
        working-directory: genja-core-python
        run: pdm install -d --frozen-lockfile

      - name: Test Rust workspace
        run: cargo test --workspace --exclude genja-core-python

      - name: Test Python bindings
        working-directory: genja-core-python
        run: pdm run test

      - name: Test PyO3 Rust crate
        working-directory: genja-core-python
        run: pdm run test-rust
