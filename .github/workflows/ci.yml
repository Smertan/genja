name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - feature/**
      - "*-genja-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release metadata
        run: python scripts/validate-release.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --exclude genja-core-python

  python:
    name: Python bindings (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4

      - name: Use selected Python for PDM
        working-directory: genja-core-python
        run: pdm use -f "$(python -c 'import sys; print(sys.executable)')"

      - name: Lock Python dependencies
        working-directory: genja-core-python
        run: pdm lock --python "==${{ matrix.python-version }}.*"

      - name: Install Python dependencies
        working-directory: genja-core-python
        run: pdm install -d --frozen-lockfile

      - name: Lint Python
        working-directory: genja-core-python
        run: pdm run lint

      - name: Typecheck Python
        working-directory: genja-core-python
        run: pdm run typecheck

      - name: Test Python
        working-directory: genja-core-python
        run: pdm run test

      - name: Test PyO3 Rust crate
        working-directory: genja-core-python
        run: pdm run test-rust
