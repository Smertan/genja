name: Publish Rust Crates

on:
  push:
    tags:
      - "rs-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Rust release tag to publish, formatted as rs-vX.Y.Z"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates.io release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Validate release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is required" >&2
            exit 1
          fi

          if ! printf '%s' "${RELEASE_TAG}" | grep -Eq '^rs-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag must match rs-vX.Y.Z: ${RELEASE_TAG}" >&2
            exit 1
          fi

          git fetch origin main --tags
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "${RELEASE_TAG} must point to a commit reachable from origin/main" >&2
            exit 1
          fi

          python scripts/validate-release.py --tag "${RELEASE_TAG}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${RELEASE_TAG#rs-v}" >> "${GITHUB_ENV}"

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          crates=(
            genja-core-derive
            genja-core
            genja-plugin-manager
            genja
          )

          for crate in "${crates[@]}"; do
            if python scripts/crates-io-version.py "${crate}" "${RELEASE_VERSION}"; then
              echo "${crate}@${RELEASE_VERSION} is already published; skipping"
              continue
            fi

            cargo package -p "${crate}"
            cargo publish -p "${crate}" --token "${CARGO_REGISTRY_TOKEN}"
            python scripts/crates-io-version.py "${crate}" "${RELEASE_VERSION}" --wait
          done
