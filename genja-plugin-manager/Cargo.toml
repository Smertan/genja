[dependencies]
async-trait = "0.1.89"
genja-core = { version = "0.1.0", path = "../genja-core" }
libloading = "0.8.8"
log = "0.4.28"
serde_json = "1.0.145"
toml = "0.9.6"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "sync"] }

[dependencies.serde]
features = ["derive"]
version = "1.0.225"

[package]
authors = ["Andre Bowen-Brown <contact@genja.co.uk>"]
categories = [
    "development-tools",
    "rust-patterns",
]
description = "Dynamic plugin loading and build support for Genja-compatible Rust applications and shared-library plugins"
edition = "2024"
keywords = [
    "plugin",
    "manager",
    "dynamic",
    "loading",
]
license = "AGPL-3.0-only"
name = "genja-plugin-manager"
readme = "README.md"
repository = "https://github.com/Smertan/genja"
version = "0.1.0"
