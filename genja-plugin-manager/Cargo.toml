[package]
name = "genja-plugin-manager"
version = "0.4.0"
edition = "2024"
authors = ["Andre Bowen-Brown <contact@genja.co.uk>"]
description = "Dynamic plugin loading and build support for Genja-compatible Rust applications and shared-library plugins"
license = "MPL-2.0"
homepage = "https://docs.genja.co.uk"
repository = "https://github.com/Smertan/genja"
readme = "README.md"
keywords = ["plugin", "manager", "dynamic", "loading"]
categories = ["development-tools", "rust-patterns"]

[dependencies]
async-trait = "0.1.89"
genja-core = { version = "0.4.0", path = "../genja-core" }
libloading = "0.8.8"
log = "0.4.28"
serde_json = "1.0.145"
toml = "0.9.6"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "sync"] }

[dependencies.serde]
features = ["derive"]
version = "1.0.225"
